[versions]
material3 = "1.5.0-beta01"
agp = "9.4.1"
coreSplashscreen = "1.2.0"
kotlin = "2.4.21"
ksp                     = "2.3.12"
coreKtx = "1.19.1"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
navigationCompose = "2.10.2"
room                    = "2.8.5"
datastore = "1.2.1"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
kotlinxSerializationJson = "1.11.0"
kotlinxCoroutines = "1.11.0"
coil                    = "2.7.0"
workManager = "2.12.0"
hiltWork = "1.4.0"
appcompat = "1.8.0"
# Google-inloggning (TP-6) och Drive-backup (TP-7 steg 2) — deklarerade, kopplas in i
# respektive issue när Firebase-projektet finns (se docs/GOOGLE-SETUP.md).
firebaseBom = "34.19.0"
credentialManager = "1.6.0"
googleIdentity = "1.2.1"
googleServices = "4.5.0"
googleAuthPlayServices  = "21.3.0"
googleApiClientAndroid  = "2.7.0"
googleApiServicesDrive  = "v3-rev20241206-2.0.0"
# UI-beroenden för kommande features (aktiveras i respektive issue)
# Vico 2.0.3 valdes mot det tidigare Kotlin 2.1.0. Med Kotlin 2.4 går nyare Vico att läsa,
# men en höjning tas i ett eget steg med skärmdumpsdiff (skill diagram).
vico                    = "2.0.3"
shimmer                 = "1.3.2"
material3Adaptive       = "1.0.0"
junit                   = "4.13.2"
junitExt = "1.3.0"
espresso = "3.7.0"
mockk                   = "1.13.13"
turbine = "1.2.1"
roomTesting             = "2.8.5"
okhttp                  = "4.12.0"
jsoup                   = "1.17.2"
pdfboxAndroid           = "2.0.27.0"
# Kontroller och JVM-UI-tester (verkstads-PR:en, regel 2 och 4). Versionerna valdes mot det
# tidigare Kotlin 2.1.0; med Kotlin 2.4 kan de höjas i ett eget steg.
# - Robolectric är ren Java (inget Kotlin-metadata); 4.16.1 kör SDK 34 på JDK 17
#   (SDK 35+ kräver Java 21 i Robolectric – se robolectric.properties).
# - Roborazzi 1.60.0 (Kotlin-metadata 2.0).
# - Konsist 0.17.3 har metadata 1.8 och tolkar källkoden med kotlin-compiler-embeddable
#   2.0.21 (bara testets körklassväg); 0.18 drar in kotlin-stdlib 2.4.
# - PMD (CPD i cpdCheck) är ren Java och körs via sin CLI i en egen konfiguration.
robolectric             = "4.16.1"
roborazzi               = "1.60.0"
konsist                 = "0.17.3"
pmd                     = "7.28.0"

[libraries]
androidx-core-ktx                    = { group = "androidx.core",            name = "core-ktx",                       version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",          version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-compose",    version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",       name = "lifecycle-runtime-compose",      version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose            = { group = "androidx.activity",        name = "activity-compose",               version.ref = "activityCompose" }
androidx-compose-bom                 = { group = "androidx.compose",         name = "compose-bom",                    version.ref = "composeBom" }
androidx-compose-ui                  = { group = "androidx.compose.ui",      name = "ui" }
androidx-compose-ui-graphics         = { group = "androidx.compose.ui",      name = "ui-graphics" }
androidx-compose-ui-tooling-preview  = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons      = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose          = { group = "androidx.navigation",      name = "navigation-compose",             version.ref = "navigationCompose" }
androidx-room-runtime                = { group = "androidx.room",            name = "room-runtime",                   version.ref = "room" }
androidx-room-ktx                    = { group = "androidx.room",            name = "room-ktx",                       version.ref = "room" }
androidx-room-compiler               = { group = "androidx.room",            name = "room-compiler",                  version.ref = "room" }
androidx-room-testing                = { group = "androidx.room",            name = "room-testing",                   version.ref = "roomTesting" }
androidx-datastore-preferences       = { group = "androidx.datastore",       name = "datastore-preferences",          version.ref = "datastore" }
hilt-android                         = { group = "com.google.dagger",        name = "hilt-android",                   version.ref = "hilt" }
hilt-compiler                        = { group = "com.google.dagger",        name = "hilt-android-compiler",          version.ref = "hilt" }
hilt-navigation-compose              = { group = "androidx.hilt",            name = "hilt-navigation-compose",        version.ref = "hiltNavigationCompose" }
kotlinx-serialization-json           = { group = "org.jetbrains.kotlinx",    name = "kotlinx-serialization-json",     version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",     version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-test",        version.ref = "kotlinxCoroutines" }
# Task.await() för Firebase Auth (TP-6) — samma coroutines-version som resten av projektet
kotlinx-coroutines-play-services     = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }
coil-compose                         = { group = "io.coil-kt",               name = "coil-compose",                   version.ref = "coil" }
androidx-core-splashscreen           = { group = "androidx.core",            name = "core-splashscreen",              version.ref = "coreSplashscreen" }
androidx-compose-ui-text-googlefonts = { group = "androidx.compose.ui",      name = "ui-text-google-fonts" }
androidx-appcompat                   = { group = "androidx.appcompat",       name = "appcompat",                      version.ref = "appcompat" }
work-runtime-ktx                     = { group = "androidx.work",            name = "work-runtime-ktx",               version.ref = "workManager" }
hilt-work                            = { group = "androidx.hilt",            name = "hilt-work",                      version.ref = "hiltWork" }
hilt-work-compiler                   = { group = "androidx.hilt",            name = "hilt-compiler",                  version.ref = "hiltWork" }
# Instrumenttest av WorkManager-schemaläggning (FundPriceRefreshScheduler, issue #27)
androidx-work-testing                = { group = "androidx.work",            name = "work-testing",                   version.ref = "workManager" }
# Nätverk (FundPriceRepository, se issue #2/#3)
okhttp                                = { group = "com.squareup.okhttp3",     name = "okhttp",                         version.ref = "okhttp" }
jsoup                                 = { group = "org.jsoup",                name = "jsoup",                          version.ref = "jsoup" }
# PDF-textextraktion (Avräkningsnota-import, se KRAVLISTA)
pdfbox-android                        = { group = "com.tom-roush",           name = "pdfbox-android",                 version.ref = "pdfboxAndroid" }
# UI-beroenden — deklarerade, wire:as i respektive feature-issue (diagram/laddning/adaptivt)
vico-compose-m3                      = { group = "com.patrykandpatrick.vico", name = "compose-m3",                    version.ref = "vico" }
compose-shimmer                      = { group = "com.valentinilk.shimmer",  name = "compose-shimmer",                version.ref = "shimmer" }
androidx-compose-material3-adaptive  = { group = "androidx.compose.material3.adaptive", name = "adaptive",            version.ref = "material3Adaptive" }
# Firebase Auth + Credential Manager (Google-inloggning, TP-6) — Credential Manager ersätter
# den utfasade GoogleSignIn-API:n; `googleid` bär GetSignInWithGoogleOption/GoogleIdTokenCredential
firebase-bom                         = { group = "com.google.firebase",      name = "firebase-bom",                   version.ref = "firebaseBom" }
firebase-auth                        = { group = "com.google.firebase",      name = "firebase-auth" }
credentials                          = { group = "androidx.credentials",     name = "credentials",                    version.ref = "credentialManager" }
credentials-play-services            = { group = "androidx.credentials",     name = "credentials-play-services-auth", version.ref = "credentialManager" }
googleid                             = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleIdentity" }
# Google Drive (molnbackup, TP-7 steg 2) — play-services-auth krävs fortfarande för
# Identity.getAuthorizationClient, som begär drive.appdata-scopet skilt från inloggningen
google-auth-play-services            = { group = "com.google.android.gms",   name = "play-services-auth",             version.ref = "googleAuthPlayServices" }
google-api-client-android            = { group = "com.google.api-client",    name = "google-api-client-android",      version.ref = "googleApiClientAndroid" }
google-api-services-drive            = { group = "com.google.apis",          name = "google-api-services-drive",      version.ref = "googleApiServicesDrive" }
# Test
junit                                = { group = "junit",                    name = "junit",                          version.ref = "junit" }
androidx-junit-ext                   = { group = "androidx.test.ext",        name = "junit",                          version.ref = "junitExt" }
androidx-espresso-core               = { group = "androidx.test.espresso",   name = "espresso-core",                  version.ref = "espresso" }
androidx-compose-ui-test-junit4      = { group = "androidx.compose.ui",      name = "ui-test-junit4" }
androidx-compose-ui-tooling          = { group = "androidx.compose.ui",      name = "ui-tooling" }
androidx-compose-ui-test-manifest    = { group = "androidx.compose.ui",      name = "ui-test-manifest" }
mockk                                = { group = "io.mockk",                 name = "mockk",                          version.ref = "mockk" }
turbine                              = { group = "app.cash.turbine",         name = "turbine",                        version.ref = "turbine" }
robolectric                          = { group = "org.robolectric",          name = "robolectric",                    version.ref = "robolectric" }
roborazzi                            = { group = "io.github.takahirom.roborazzi", name = "roborazzi",                 version.ref = "roborazzi" }
roborazzi-compose                    = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose",         version.ref = "roborazzi" }
roborazzi-junit-rule                 = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule",      version.ref = "roborazzi" }
konsist                              = { group = "com.lemonappdev",          name = "konsist",                        version.ref = "konsist" }
pmd-cli                              = { group = "net.sourceforge.pmd",      name = "pmd-cli",                        version.ref = "pmd" }
pmd-kotlin                           = { group = "net.sourceforge.pmd",      name = "pmd-kotlin",                     version.ref = "pmd" }

[plugins]
android-application  = { id = "com.android.application",                   version.ref = "agp" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
hilt                 = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Appliceras först i auth-issuet: pluginet fäller bygget så länge app/google-services.json
# saknas, och filen kommer först när Firebase-projektet är uppsatt (docs/GOOGLE-SETUP.md)
google-services      = { id = "com.google.gms.google-services",            version.ref = "googleServices" }
# Skärmdumpar i JVM: recordRoborazziDebug / verifyRoborazziDebug (skill testing-strategy)
roborazzi            = { id = "io.github.takahirom.roborazzi",             version.ref = "roborazzi" }
