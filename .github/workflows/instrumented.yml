# Instrumenttesterna på Android-emulator (skill ci-budget) – en definition för två anropare:
# android.yml (PR:er som rör koden de testar, filtret `instrumented`, eller på begäran) och
# release.yml (när samma kod inte redan testats grönt i en PR).
name: Instrumenttester

on:
  workflow_call:

permissions:
  contents: read

jobs:
  instrumented:
    name: instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          device: pixel_6
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Print failure stack traces
        if: failure()
        run: |
          find app/build/outputs/androidTest-results app/build/reports/androidTests \
            -name '*.xml' -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
