# PR-flödet (regel 5, skill ci-budget – tabellen där beskriver det här flödet och ändras i
# samma PR). Jobbet `changes` startar alltid och avgör vad som körs; `ci-ok` är det enda
# obligatoriska statuskravet (ett hoppat jobb rapporterar ingen egen status att lita på).
#
# Release-bygget (R8) och lint körs inte här utan i quality.yml (veckovis, på begäran) och i
# release.yml (NFR-2, NFR-4).
name: Android CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      instrumented:
        description: 'Kör även instrumenttesterna på emulator'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter läser PR:ens ändrade filer

# En ny push till samma PR avbryter den förra körningen; master avbryts aldrig.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_app: ${{ steps.decide.outputs.run_app }}
      run_instrumented: ${{ steps.decide.outputs.run_instrumented }}
    steps:
      - uses: actions/checkout@v4

      # Repot är publikt, och .gitignore skyddar inte mot GitHub-webbens uppladdning eller
      # `git add -f` — så release-nyckeln checkades in en gång (commit 9403cf5) och låg
      # publikt tills den upptäcktes. Den här grinden fäller bygget i stället, för alla
      # nyckelfiler utom den avsiktligt incheckade debug-nyckeln (vars lösenord är Androids
      # kända standardvärden och därför inte är en hemlighet). Den ligger här, inte i
      # build-and-test, så att den körs i varje PR – även en som hoppar över bygget.
      - name: Ingen signeringsnyckel i repot
        run: |
          set -euo pipefail
          found=$(git ls-files '*.jks' '*.keystore' '*.p12' '*.pem' \
            | grep -v '^app/debug\.keystore$' || true)
          if [ -n "$found" ]; then
            echo "::error::Signeringsnyckel incheckad: $found — ta bort den och betrakta nyckeln som bränd (docs/GOOGLE-SETUP.md)"
            exit 1
          fi

      # Hooktestet (regel4-check, baslinjen i ui-allowlist.txt, hookkommandona i settings.json)
      # körs i varje PR – det tar några sekunder och behöver varken JDK eller Gradle. Globben
      # expanderas av skalet: runnerns Node 20 tolkar inte globbar i `node --test`.
      - name: Hooktest (regel 4)
        run: node --test .claude/hooks/test/*.test.mjs

      - name: Ändrade sökvägar
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'app/src/**'
              - 'app/build.gradle.kts'
              - 'config/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - '.github/workflows/android.yml'
            instrumented:
              - 'app/src/main/**'
              - 'app/src/androidTest/**'
              - 'app/build.gradle.kts'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'

      - name: Vad körs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          APP: ${{ steps.filter.outputs.app }}
          INSTRUMENTED: ${{ steps.filter.outputs.instrumented }}
          DISPATCH_INSTRUMENTED: ${{ inputs.instrumented }}
        run: |
          set -euo pipefail
          # Instrumenttesterna (emulator) bara i PR:er som rör koden de testar, eller på begäran –
          # inte på master: PR:en har redan kört dem.
          if [ "$EVENT" = "pull_request" ]; then
            app=false; instrumented=false
            if [ "$APP" = true ]; then app=true; fi
            if [ "$INSTRUMENTED" = true ]; then instrumented=true; fi
            why="PR – filter: app=$APP instrumented=$INSTRUMENTED"
          else
            app=true; instrumented=false
            if [ "$DISPATCH_INSTRUMENTED" = true ]; then instrumented=true; fi
            why="$EVENT – bygg och enhetstester alltid (baslinje och cache), instrumenttester=$instrumented"
          fi
          {
            echo "run_app=$app"
            echo "run_instrumented=$instrumented"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Vad körs"
            echo "$why"
            echo ""
            echo "| Del | Körs |"
            echo "|---|---|"
            echo "| nyckelgrind | true |"
            echo "| hooktest (regel 4) | true |"
            echo "| kompilering, enhetstester, Robolectric, skärmdumpsjämförelse, UiConsistencyTest och cpdCheck (\`build-and-test\`) | $app |"
            echo "| instrumenttester på emulator (\`instrumented-tests\`) | $instrumented |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: build-and-test
    needs: changes
    if: needs.changes.outputs.run_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      # JDK 21: Robolectric kräver det för SDK 36. Koden byggs fortfarande för Java 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Beroende- och build cache skrivs bara från master och läses i PR.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # Robolectric hämtar sin SDK-jar (android-all-instrumented) till ~/.m2 utanför Gradles cache.
      - name: Cache för Robolectrics SDK-jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Ett enda Gradle-anrop (projektet konfigureras en gång). verifyRoborazziDebug kör
      # testDebugUnitTest – alla enhetstester, Robolectric-testerna och UiConsistencyTest (Konsist) –
      # med skärmdumpsjämförelsen påslagen, så testerna körs en gång och en skärmdump som skiljer
      # från referensen i app/src/test/screenshots/ fäller bygget (tolerans i testing/Screenshots.kt).
      # cpdCheck är copy-paste-detektorn (regel 4). androidTest-koden kompileras här så att ett
      # kompileringsfel syns innan emulatorn startar.
      - name: Kompilera och kör enhetstester och skärmdumpsjämförelse
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: ./gradlew --continue :app:compileDebugKotlin :app:verifyRoborazziDebug :app:compileDebugAndroidTestKotlin :cpdCheck

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            build/reports/cpd/
          if-no-files-found: ignore

      # Vid en skärmdumpsdiff: bilderna (<namn>_compare.png med referens, ny bild och diff sida
      # vid sida, samt <namn>_actual.png) och jämförelserapporten. Kort lagring – de behövs bara
      # tills PR:en rättats eller referenserna spelats in på nytt.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            app/build/outputs/roborazzi/
            app/build/test-results/roborazzi/
            app/build/reports/roborazzi/
          retention-days: 7
          if-no-files-found: ignore

  # Emulatorjobbet ligger i instrumented.yml, som release.yml också anropar. `needs` på
  # build-and-test: ett rött bygge startar aldrig emulatorn (ersätter
  # cancel-instrumented-on-failure).
  instrumented-tests:
    name: instrumented-tests
    needs: [changes, build-and-test]
    if: needs.changes.outputs.run_instrumented == 'true'
    uses: ./.github/workflows/instrumented.yml

  ci-ok:
    name: ci-ok
    needs: [changes, build-and-test, instrumented-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Alla körda jobb gröna
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultat: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Ett jobb blev $r"; exit 1 ;;
            esac
          done
