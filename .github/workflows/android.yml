name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      # Repot är publikt, och .gitignore skyddar inte mot GitHub-webbens uppladdning eller
      # `git add -f` — så release-nyckeln checkades in en gång (commit 9403cf5) och låg
      # publikt tills den upptäcktes. Den här grinden fäller bygget i stället, för alla
      # nyckelfiler utom den avsiktligt incheckade debug-nyckeln (vars lösenord är Androids
      # kända standardvärden och därför inte är en hemlighet).
      - name: Ingen signeringsnyckel i repot
        run: |
          set -euo pipefail
          found=$(git ls-files '*.jks' '*.keystore' '*.p12' '*.pem' \
            | grep -v '^app/debug\.keystore$' || true)
          if [ -n "$found" ]; then
            echo "::error::Signeringsnyckel incheckad: $found — ta bort den och betrakta nyckeln som bränd (docs/GOOGLE-SETUP.md)"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Compile debug unit test Kotlin
        run: ./gradlew :app:compileDebugUnitTestKotlin

      - name: Compile debug Android test Kotlin
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

  # Sidoordnat build-and-test (inget needs:) — jobben kör samtidigt på var sin runner,
  # så grinden kostar en extra runner men ingen extra väntetid.
  #
  # Skälet: CI byggde bara debug, som inte kör R8. Minifiering, resursskrympning och
  # proguard-reglerna rördes därför av ingen automatik alls — de prövades först när
  # någon försökte släppa. Det brast två gånger: pdfbox saknade JPEG-2000-avkodare låg
  # latent i månader (#108), och Google API-klienten (#111) avvärjdes bara av ett
  # manuellt releasebygge någon råkade tänka på. Varje nytt beroende var en obevakad
  # R8-risk fram tills nästa släpp.
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Osignerat med flit: build.gradle.kts sätter bara signingConfig när SIGNING_*
      # finns, så jobbet behöver varken keystore eller secrets — och fungerar därmed
      # även från en fork. APK:n slängs; det är R8 vi är ute efter, inget installerbart
      # (att publicera en APK är release.yml:s uppgift).
      - name: Bygg release (R8 + resursskrympning)
        run: ./gradlew :app:assembleRelease

  cancel-instrumented-on-failure:
    # Båda jobben, inte bara build-and-test: ett R8-fel ska också avbryta emulatorn,
    # annars betalas 18 minuter för ett bygge som redan är dömt.
    needs: [build-and-test, release-build]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel in-progress Instrumented Tests run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
            });
            for (const run of data.workflow_runs) {
              if (run.name === 'Instrumented Tests' && ['queued', 'in_progress'].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
              }
            }
